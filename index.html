<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mas Ipan 🌻</title><style>
body{
margin:0;
overflow:hidden;
background:black;
color:white;
font-family:Arial;
}

.bg{
position:fixed;
inset:0;
background:radial-gradient(circle,#2b1055,#000);
animation:bg 10s infinite alternate;
z-index:-2;
}

@keyframes bg{from{transform:scale(1)}to{transform:scale(1.1)}}

.scene{
position:absolute;
inset:0;
animation:zoom 12s infinite alternate ease-in-out;
}

@keyframes zoom{
from{transform:scale(1)}
to{transform:scale(1.12)}
}

.slide{
position:absolute;
width:100%;height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
opacity:0;
transition:1s;
filter:blur(10px);
text-align:center;
padding:20px;
}

.active{
opacity:1;
filter:blur(0);
}

.btn{
padding:10px 18px;
border:none;
border-radius:20px;
background:gold;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

.star{
position:absolute;
width:2px;height:2px;
background:white;
border-radius:50%;
animation:tw 2s infinite;
}

@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}

.shooting-star{
position:absolute;
width:120px;height:2px;
background:linear-gradient(90deg,#fff,transparent);
transform:rotate(-45deg);
animation:shoot 3s linear infinite;
opacity:0;
}

@keyframes shoot{
0%{transform:translate(0,0) rotate(-45deg);opacity:0}
10%{opacity:1}
100%{transform:translate(500px,500px) rotate(-45deg);opacity:0}
}

.sun{
width:80px;height:80px;
background:gold;
border-radius:50%;
box-shadow:0 0 40px gold;
}

.orbit{
width:220px;height:220px;
border:1px solid rgba(255,255,255,.15);
border-radius:50%;
position:absolute;
animation:spin 12s linear infinite;
}

.planet{
width:25px;height:25px;
background:deepskyblue;
border-radius:50%;
position:absolute;
top:0;left:50%;
transform:translateX(-50%);
box-shadow:0 0 10px cyan;
}

.orbit2{animation:spinReverse 18s linear infinite; width:320px;height:320px;}
.planet2{width:18px;height:18px;background:#ff4fd8;box-shadow:0 0 10px pink;}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spinReverse{from{transform:rotate(360deg)}to{transform:rotate(0)}}

.flower{
position:absolute;
font-size:18px;
animation:fall 6s linear infinite;
}

@keyframes fall{to{transform:translateY(110vh)}}

.textBox{
max-width:600px;
animation:float 3s infinite;
}

@keyframes float{50%{transform:translateY(-10px)}}

.typing{
font-size:22px;
letter-spacing:1px;
}
</style></head><body><div class="bg"></div>
<div class="scene"><audio id="bgm" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_d5a3c6d1c1.mp3">
</audio><!-- INTRO --><div class="slide active" id="s0">
<div class="typing" id="typing"></div>
<button class="btn" onclick="start()">Mulai ✨</button>
</div><!-- SPACE --><div class="slide" id="s1">
<div class="sun"></div>
<div class="orbit"><div class="planet"></div></div>
<div class="orbit orbit2"><div class="planet planet2"></div></div>
</div><!-- FLOWER --><div class="slide" id="s2">
<h2>🌻 Sunflower Rain</h2>
</div><!-- TEXT --><div class="slide" id="s3">
<div class="textBox">
<h2>Barakallah fii umrik mas Ipan 🌻</h2>
<p>Udah naik level ke 23 tahun nih xixi, semoga selalu bahagia, sehat, dan dilancarkan semuanya ✨</p>
<p>Kayak bunga matahari yang selalu cari cahaya 🌻</p>
<p><b>Happy Birthday 🎉</b></p>
</div>
</div></div><script>
let i=0;

// typing intro
const text="Hai haii mas Ipan klik tombol di sini ya 🌻";
let idx=0;
function type(){
if(idx<text.length){
document.getElementById("typing").innerHTML+=text.charAt(idx);
idx++;
setTimeout(type,60);
}
}
type();

function start(){
// small click sound (WebAudio)
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
osc.frequency.value=600;
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+0.1);

// music
const m=document.getElementById("bgm");
m.volume=0.7;
m.play().catch(()=>{});

next();
}

function next(){
document.querySelectorAll(".slide").forEach(s=>s.classList.remove("active"));
i++;
document.getElementById("s"+i).classList.add("active");

if(i==1) stars();
if(i==2) flowers();
if(i>=1) shoot();
}

function stars(){
for(let a=0;a<70;a++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}
}

function shoot(){
for(let i=0;i<3;i++){
let sh=document.createElement("div");
sh.className="shooting-star";
sh.style.left=Math.random()*100+"vw";
sh.style.top=Math.random()*100+"vh";
document.body.appendChild(sh);
}
}

function flowers(){
for(let a=0;a<50;a++){
let f=document.createElement("div");
f.className="flower";
f.innerHTML="🌻";
f.style.left=Math.random()*100+"vw";
f.style.top="-20px";
document.body.appendChild(f);
}
}
</script></body>
</html>
